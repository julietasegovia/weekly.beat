name: Weekly Bandcamp scrape

on:
  schedule:
    - cron: '15 2 * * 1'
  workflow_dispatch: {}

permission:
  contents: write

concurrency:
  group: weekly-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weekly.bot
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Scrape Bandcamp Discover
        run: python3 main.py

      - name: Classify genres
        run: python3 main.py --classify

      - name: Commit updated candidates.db
        run:
          git config user.name "weekly-bot"
          git config user.email "weekly-bot@users.noreply.github.com"
          git add candidates.db
            if git diff --cached --quiet; then
              echo "no changes"
            esle
              git commit -m "weekly scrape: $(date -u +'%Y-%m-%d %H:%M UTC')"
              git push
            fi